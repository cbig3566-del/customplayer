name: Build Minecraft Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name 'player-join-alert-*.zip' | head -n 1)
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d project

          echo "Looking for Gradle project..."
          find project -name settings.gradle -o -name build.gradle

      - name: Configure project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -n 1)")
          echo "Project directory: $PROJECT_DIR"

          mkdir -p "$PROJECT_DIR/libs"

          echo "Adding CurseMaven repository..."
          sed -i '/mavenCentral()/i\        maven { name = "CurseMaven"; url = uri("https://cursemaven.com") }' "$PROJECT_DIR/settings.gradle"

          echo "Project configured."

      - name: Build mod
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -n 1)")
          echo "Building from: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: player-join-alert
          path: project/**/build/libs/*.jar
