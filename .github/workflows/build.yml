name: Build Minecraft Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: |
          set -e
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name 'player-join-alert-*.zip' | head -n 1)
          test -n "$ZIP"
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        id: project
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -n 1)")
          test -f "$PROJECT_DIR/build.gradle"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build mod
        run: |
          set -e
          gradle -p "${{ steps.project.outputs.dir }}" clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: player-join-alert
          path: project/**/build/libs/*.jar
          if-no-files-found: error
